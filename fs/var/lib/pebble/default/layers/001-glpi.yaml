services:
  php:
    override: replace
    startup: enabled
    command: /usr/sbin/php-fpm8.5 --nodaemonize

  cron:
    override: replace
    startup: enabled
    command: supercronic -passthrough-logs /etc/crontab

  nginx:
    override: replace
    startup: enabled
    command: /usr/sbin/nginx -g "daemon off;"
    after:
    - php

  logger:
    override: replace
    startup: enabled
    command: /var/lib/pebble/default/logger
    after:
    - nginx
